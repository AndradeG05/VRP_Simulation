name: routescope

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      PHOTON_BASE_URL: ${PHOTON_BASE_URL:-https://photon.komoot.io}
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - routescope-data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_OSM_TILE_URL: ${VITE_OSM_TILE_URL:-}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  routescope-data:
